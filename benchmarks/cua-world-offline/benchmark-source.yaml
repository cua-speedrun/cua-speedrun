    `target_continent` (default: Europe, regex: `^[a-zA-Z ]+$`). Declare geometry
    column `geom` as MultiPolygon, SRID 4326; compute bounding box from data. Create
    SLD style `urban_density_gradient` with five rules on `city_count`: 0 -> fill
    #D3D3D3, 1-2 -> #AEC7E8, 3-5 -> #2CA02C, 6-10 -> #FF7F0E, 11+ -> #D62728 (all
