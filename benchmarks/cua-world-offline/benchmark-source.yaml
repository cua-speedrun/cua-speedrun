- id: cua_world_long_jamovi_env__personality_age_regression_diagnostics
  env_name: jamovi_env
  task_name: personality_age_regression_diagnostics
  platform: linux
  environment_sha256: a58d1b9cc2f0c0d74477ae9ee81702cc47ff12f0424d2075a904d02a70e7a881
  description: 'Using the BFI-25 personality data (BFI25.csv, already open in Jamovi),
    investigate whether personality traits predict participant age beyond gender.


    Reverse-code items E1 and E2 by computing new variables E1r = 7 - E1 and E2r =
    7 - E2. Compute two personality scale scores: Extra = MEAN(E1r, E2r, E3, E4, E5)
    and Neuro = MEAN(N1, N2, N3, N4, N5). Set gender as a nominal variable.


    Run a Cronbach''s alpha reliability analysis on the Extraversion scale items (E1r,
    E2r, E3, E4, E5) with both Cronbach''s alpha and McDonald''s omega enabled.


    Run a hierarchical linear regression predicting age. Block 1: gender alone. Block
    2: gender + Extra + Neuro. Enable standardized estimates, confidence intervals,
    collinearity statistics (VIF), and the Durbin-Watson test. Save the residuals
    from this regression as a new variable, then run descriptive statistics on the
    residuals with a Shapiro-Wilk normality test and Q-Q plot.


    Save the project as Personality_Age.omv in ~/Documents/Jamovi/. Write a report
    to ~/Documents/Jamovi/age_analysis_report.txt containing: Extraversion Cronbach''s
    alpha, Block 1 R-squared, Block 2 R-squared, R-squared change, the overall model
    F-statistic and p-value for Block 2, the standardized beta coefficients for Extra
    and Neuro, VIF values for Extra and Neuro, Durbin-Watson d statistic, and the
    Shapiro-Wilk W statistic and p-value for the residuals.'
- id: cua_world_long_jasp_env__regression_pipeline_world_happiness
  env_name: jasp_env
