  description: 'You are the database administrator for the Chinook music store. An
    audit has flagged invoicing anomalies, and management wants regional revenue analysis.
    In LibreOffice Base with chinook.odb, perform a full invoice reconciliation and
    build a regional revenue breakdown.


    Some invoices have a stored Total that does not match the sum of their InvoiceLine
    amounts (UnitPrice * Quantity). Create a view ''InvoiceHealthCheck'' joining Invoice
    and InvoiceLine, grouped by InvoiceId, returning InvoiceId, StoredTotal (Invoice.Total),
    CalculatedTotal (SUM of UnitPrice*Quantity), and Difference -- only where the
    two disagree. Create a table ''CorrectionBatch'' (InvoiceId INTEGER PK, OldTotal
    NUMERIC(10,2), CorrectTotal NUMERIC(10,2), CorrectionDate DATE) and populate it
    with all discrepancies found. Then correct every flagged invoice''s Total in the
    Invoice table to match its calculated amount.


    For the regional analysis, create a table ''RegionMapping'' (RegionId INTEGER
    PK, RegionName VARCHAR(100)) with rows: (1,''North America''), (2,''Europe''),
    (3,''South America''), (4,''Asia Pacific''), (5,''Other''). Add a RegionId column
    to the Invoice table and assign every invoice a region by BillingCountry: USA/Canada
    to 1; Germany/France/United Kingdom/Czech Republic/Portugal/Austria/Belgium/Denmark/Finland/Hungary/Ireland/Italy/Netherlands/Norway/Poland/Spain/Sweden
    to 2; Brazil/Argentina/Chile to 3; Australia/India to 4; all others to 5. Create
    a saved query ''RegionalRevenueBreakdown'' joining Invoice and RegionMapping,
    returning RegionName, InvoiceCount (COUNT), TotalRevenue (SUM of Total), AvgOrderValue
    (AVG of Total), grouped by RegionName, sorted by TotalRevenue descending.


    Finally, create a view ''CorrectionAuditTrail'' joining CorrectionBatch, Invoice,
    and Customer showing InvoiceId, customer full name, BillingCountry, OldTotal,
    CorrectTotal, absolute Difference, and CorrectionDate. Save the database.'
