    Using the Bologna Pasubio scenario at /home/ga/SUMO_Scenarios/bologna_pasubio/,
    run the baseline simulation with edge-level mean data collection (300-second aggregation
    intervals). Compute per-intersection average vehicle delay by comparing measured
    edge travel times against free-flow travel times (edge_length / speed_limit) on
    approach edges to each signalized intersection. Identify the three intersections
    with the highest average delay.


    For these three intersections, analyze traffic demand on each approach from the
    route files and redesign signal timing with demand-proportional green phase durations.
    Maintain minimum 5-second green per phase and keep cycle lengths between 60 and
    150 seconds. Leave all other intersections unchanged.


    Create an optimized TLS file at /home/ga/SUMO_Scenarios/bologna_pasubio/pasubio_tls_optimized.add.xml
    and a simulation config at /home/ga/SUMO_Scenarios/bologna_pasubio/run_optimized.sumocfg
