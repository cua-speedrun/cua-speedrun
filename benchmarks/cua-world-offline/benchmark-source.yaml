  platform: linux
  environment_sha256: b84587317ea74acf2795c7b016f1244066e637a1e7bb3a3faf8da461e2cec541
  description: 'You are a Senior Integration Engineer building an end-to-end clinical
    pipeline for a regional hospital network. The system must process ADT admission/discharge
    events to maintain a live patient census, then use that census to validate incoming
    lab results before routing critical values to an alerting system.


    Channel 1: ''ADT_Census_Manager'' — TCP Listener on port 6661 (MLLP). For ADT^A01
    (admit): insert into the active_census table (mrn, patient_name, department, attending_physician,
    status=''active'', admit_time). For ADT^A03 (discharge): update the matching patient''s
    status to ''discharged'' with discharge_time. Return a standard HL7 ACK.


    Channel 2: ''Lab_Results_Validator'' — TCP Listener on port 6662 (MLLP). JavaScript
    transformer queries active_census by MRN (PID-3.1). If the patient has status=''active'':
    enrich with department and attending_physician, then route to Channel 3 via Channel
    Writer. If not found or discharged: insert into rejected_results table. Response
    Transformer returns MSA|AA (with department in MSA-6) for accepted, or MSA|AR
    for rejected.


    Channel 3: ''Critical_Value_Processor'' — Receives from Channel 2. Insert ALL
    results into lab_results table (mrn, test_code, result_value, units, abnormal_flag,
    physician, department). If any OBX-8 contains ''HH'' or ''LL'', also insert into
    critical_alerts table and write a JSON alert file to /tmp/critical_alerts/.


    Create all database tables yourself. Sample HL7 messages are at /home/ga/. REST
    API: https://localhost:8443/api (admin/admin, header: X-Requested-With: OpenAPI).
    PostgreSQL: jdbc:postgresql://nextgen-postgres:5432/mirthdb (postgres/postgres).'
