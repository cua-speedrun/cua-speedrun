  platform: linux
  environment_sha256: dbd00234c17d630fde6cfd7a2a9187da13c95081fae4998382841f96ce864323
  description: 'Open the tensile test data at ~/Documents/GeoGebra/data/tensile_test.csv
    containing stress (MPa) and strain (%) measurements from a 6061-T6 aluminum specimen.
    Enter the data as points in GeoGebra and create a scatter plot. Fit a Ramberg-Osgood
    model: strain(stress) = 100 * (stress/E + (stress/K)^n), using three sliders:
    E (50000 to 90000, step 1000), K (300 to 900, step 10), and n (3 to 30, step 1).
    Adjust the sliders until the model curve closely fits the experimental data through
    both the elastic and yielding regions. Create residual segments between each data
    point and the corresponding point on the model curve. Add a text element displaying
    the sum of squared residuals. Determine the 0.2% offset yield strength: plot the
    offset line g(x) = 100*x/E + 0.2, find its intersection with the model curve,
    and mark the yield point. Display ''Yield Stress = [value] MPa'' as text. Save
    as tensile_analysis.ggb in ~/Documents/GeoGebra/projects/.'
- id: cua_world_long_gmat_env__mars_orbit_capture_and_science_acquisition
