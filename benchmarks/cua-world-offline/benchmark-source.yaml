    Input files at ~/UGENE_Data/cloning_design/:

    - pET28a_vector.gb — pET-28a(+) expression vector, 5369 bp, circular

    - epo_insert.gb — human EPO coding sequence, 582 bp, linear


    Analyze both sequences in UGENE. For the vector, find all ORFs (minimum 300 bp)
    and map all restriction enzyme sites. For the EPO insert, map all restriction
    enzyme sites. Identify a compatible pair of two different restriction enzymes
    that each cut exactly once within the pET-28a multiple cloning site (MCS, positions
    158–203) and do not cut anywhere within the EPO sequence.


    Export the annotated vector to ~/UGENE_Data/cloning_design/results/pET28a_annotated.gb
    and the annotated EPO insert to ~/UGENE_Data/cloning_design/results/epo_annotated.gb,
    both in GenBank format with restriction site and ORF annotations preserved. Generate
    a circular map of the annotated vector and export it as ~/UGENE_Data/cloning_design/results/vector_map.svg.


    Write a cloning strategy report to ~/UGENE_Data/cloning_design/results/cloning_report.txt
    containing: the selected enzyme pair with their cut positions in the vector, confirmation
    that neither enzyme cuts in EPO, the expected recombinant construct size, and
    a complete list of all ORFs found in the vector with their names and base-pair
    positions.'
- id: cua_world_long_urban_sim_env__redevelopment_probability_upzoning
  env_name: urban_sim_env
  task_name: redevelopment_probability_upzoning
  platform: linux
  environment_sha256: 9dbbcb91ed09675a9f22d306a0fdc199b7c41e6adf816c6d96cb44a6664b9a95
  description: 'As a development analyst, build a residential redevelopment probability
    model and use it to project housing development under a proposed upzoning scenario.
    Use /home/ga/urbansim_projects/data/sanfran_public.h5, working in /home/ga/urbansim_projects/notebooks/redevelopment_model.ipynb.


    For each residential building (residential_units >= 1), compute three features:
    parcel_sqft (shape_area * 10.764 from the parcels table), zoning_headroom ((max_far
    * parcel_sqft - building_sqft) / (max_far * parcel_sqft), capped to [0, 1]) obtained
    via the zoning_for_parcels bridge table and the zoning table, and zone_median_income
    from the households table joined through buildings to parcels to zones. Exclude
    buildings where max_far <= 0 or building_sqft is missing, and drop rows with any
    NaN features. Flag buildings with year_built >= 2000 as recently_developed=1,
    else 0.


    Train a logistic regression predicting recently_developed from parcel_sqft, zoning_headroom,
    and zone_median_income using a 70/30 train/test split with random_state=42. Report
    the AUC score. Then simulate a 50% upzoning scenario by increasing max_far by
    50%, recomputing zoning_headroom, and predicting new redevelopment probabilities
    with the trained model. For each zone, compute expected_baseline_developments
    and expected_scenario_developments (sums of predicted probabilities) and development_uplift
    (scenario minus baseline).


    Export /home/ga/urbansim_projects/output/model_metrics.json containing auc_score,
    n_train, n_test, coefficients (feature name to value dict), and intercept. Export
    /home/ga/urbansim_projects/output/zone_development_impact.csv with columns zone_id,
    n_buildings, expected_baseline_developments, expected_scenario_developments, development_uplift,
    and zone_median_income. Save a scatter plot of baseline vs scenario expected developments
    per zone with a y=x reference line and points colored by development_uplift magnitude
    to /home/ga/urbansim_projects/output/scenario_comparison_chart.png.'
