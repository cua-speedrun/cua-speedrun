schema_version: 1
prepare:
  default_environment: modal-native
native_image:
  manifest: benchmarks/desktop-images.json
  name: cua-world-base
required_devices:
  docker_desktop_env: [/dev/kvm]
host_runtime:
  native_runner: gym-anything
  forward_env:
  - GEMINI_API_KEY
  - OPENAI_API_KEY
  - OPENROUTER_API_KEY
name: cua-world-offline
version: '0.1'
description: The 143-task offline CUA-World long-horizon benchmark.
source_benchmark:
  name: cua_world
  repository: https://github.com/cmu-l3/gym-anything
  commit: d5e3f88bdc66fcc79c037c4e5da48554535e52bb
  archive_sha256: 29aefe3285860706b97bc61f7be6c9cab313f536773e2768abefdb40cb4ce293
selection:
  split: long_horizon
  selected_task_count: 143
  platform_counts:
    windows: 0
    linux: 143
    android: 0
protocol:
  task_limits: source_task_json
  verifier: source_task_json
  cache_level: default
asset_setup:
  fetch_script_environments:
  - jasp_env
  - nx_witness_vms_env
  - openbci_gui_env
  - openemr_env
  - panoply_env
  - reqview_env
  - urban_sim_env
  manual_download_environments: []
materializer:
  path: scripts/import_cua_world_long.py
  function: materialize
  inputs:
  - scripts/import_cua_world_long.py
  - benchmarks/desktop-images.json
  - benchmarks/cua-world-26/setup-patches/jstock.yaml
  - benchmarks/cua-world-26/setup-patches/odoo.yaml
  - benchmarks/cua-world-26/setup-patches/dhis2.yaml
  - benchmarks/cua-world-26/setup-patches/oracle.yaml
  - benchmarks/cua-world-26/setup-patches/splunk.yaml
  - benchmarks/cua-world-26/setup-patches/wps.yaml
  - benchmarks/cua-world-26/setup-patches/openclinic.yaml
  - benchmarks/cua-world-26/setup-patches/projectlibre.yaml
  - benchmarks/cua-world-26/setup-patches/pymol.yaml
  - benchmarks/cua-world-26/setup-patches/rocket-chat.yaml
setup_patches:
  jstock_env: benchmarks/cua-world-26/setup-patches/jstock.yaml
  odoo_inventory_env: benchmarks/cua-world-26/setup-patches/odoo.yaml
  dhis2_env: benchmarks/cua-world-26/setup-patches/dhis2.yaml
  oracle_database_env: benchmarks/cua-world-26/setup-patches/oracle.yaml
  splunk_env: benchmarks/cua-world-26/setup-patches/splunk.yaml
  wps_presentation_env: benchmarks/cua-world-26/setup-patches/wps.yaml
  openclinic_ga_env: benchmarks/cua-world-26/setup-patches/openclinic.yaml
  project_libre_env: benchmarks/cua-world-26/setup-patches/projectlibre.yaml
  pymol_env: benchmarks/cua-world-26/setup-patches/pymol.yaml
  rocket_chat_env: benchmarks/cua-world-26/setup-patches/rocket-chat.yaml
tasks:
- id: cua_world_long_aerobridge_env__onboard_new_operator_fleet
  env_name: aerobridge_env
  task_name: onboard_new_operator_fleet
  platform: linux
  environment_sha256: 0a8ea087dd7530c001c0243e6ff75af76d6627cdd170b2e4fad548898a661ee7
  description: 'You are using Aerobridge, an open-source drone/UAV fleet management
    system (admin login: http://localhost:8000/admin/, username: admin, password:
    adminpass123). Complete the full regulatory onboarding for a new drone operator.


    1. COMPANY & OPERATOR: Register company ''Horizon Aerial Services Pvt Ltd'' (common
    name: ''Horizon Aerial'', role: Operator, country: India, email: ops@horizonaerial.in,
    website: http://www.horizonaerial.in). Create its Operator record (type: Non-LUC,
    authorized activities: photographing and videotaping, operational authorizations:
    SORA).


    2. PILOTS: Create Person records for (a) Arjun Mehta (email: arjun.mehta@horizonaerial.in)
    and (b) Priya Sharma (email: priya.sharma@horizonaerial.in). Then create a Pilot
    record for each, linked to the Horizon Aerial operator, using the ''Default Aerobridge
    Document''.


    3. FLEET: Register two aircraft: ''HA-Scout-01'' (flight controller ID: HASC01CTRL001)
    and ''HA-Scout-02'' (flight controller ID: HASC02CTRL002). Both should be Active,
    operator: Horizon Aerial Services, manufacturer: Aerobridge Drone Company. Use
    the pre-configured ''Horizon Surveyor X1'' assemblies.


    4. CERTIFICATION FLIGHT: Create Flight Plan ''Mumbai Harbor Survey'' with a GeoJSON
    Polygon covering the Mumbai harbor area (approx 18.94N, 72.84E) and a non-empty
    plan file JSON. Then create Flight Operation ''HA Fleet Certification Flight''
    using aircraft HA-Scout-01, pilot Arjun Mehta, operator Horizon Aerial, plan Mumbai
    Harbor Survey, purpose photographing, type VLOS, scheduled 2026-04-01 09:00 to
    12:00.'
- id: cua_world_long_apache_openoffice_env__quarterly_financial_review_compile
  env_name: apache_openoffice_env
  task_name: quarterly_financial_review_compile
  platform: linux
  environment_sha256: 6f36f06206794138f0f0fe6f8d76d7ff28e5d04c37ece1ed42a4f4b518fc54a5
  description: 'You are the Controller at Pacific Northwest Timber Products. Open
    the draft quarterly review at /home/ga/Documents/Q3_review_draft.odt and the financial
    data at /home/ga/Documents/financial_data.json. Complete the Q3 FY2024 Quarterly
    Financial Review.


    The Consolidated P&L table in Section 2 contains incorrect manually-typed totals.
    Delete them and replace with Writer table formulas: a Total Revenue formula summing
    the four revenue line items, a Total Expenses formula summing the six expense
    line items, and a Net Operating Income formula computing Revenue minus Expenses.


    Section 4 ("Capital Expenditures") contains only placeholder text. Replace it
    with a landscape-oriented page showing a 5-year CapEx projection table from the
    JSON data, with the four projects and their FY2024 through FY2028 values. Add
    a formula row computing each fiscal year''s column total. After the table, include
    the executive note about the Sawmill Line #3 project status from the JSON.


    Three section headings (Sections 2, 4, and 5) use bold body text instead of Heading
    1 paragraph style — apply the correct style. Insert an auto-generated Table of
    Contents after the title page. Add a running footer with "PNTP — CONFIDENTIAL"
    left-aligned and "Page X of Y" right-aligned.


    Save as /home/ga/Documents/PNTP_Q3_Review_FY2024.odt.'
- id: cua_world_long_ardour_env__broadcast_podcast_stem_delivery
  env_name: ardour_env
  task_name: broadcast_podcast_stem_delivery
  platform: linux
  environment_sha256: dd418f4ac6a74a683892f6413eaee7e22ce0ce53de94ee22ff1ebbd4ca2046ec
  description: You are the audio engineer delivering the final mix of Episode 12 of
    the podcast 'The Deep Dive.' The Ardour session has four named tracks (Host, Guest,
    Music_Bed, SFX) with corresponding audio files in the session's audiofiles directory.
    Complete the full mix-down and stem delivery following the mixing notes at ~/Desktop/mixing_notes.txt
    — covering audio import, submix bus routing, gain/pan staging, music ducking automation,
    chapter markers, and stem exports to /home/ga/Audio/podcast_delivery/. Save a
    session snapshot named 'EP12_Final_Mix' when complete.
- id: cua_world_long_astroimagej_env__multiband_cmd_photometry
  env_name: astroimagej_env
  task_name: multiband_cmd_photometry
  platform: linux
  environment_sha256: 4d0761c17e78ae08fe9bec5e2af3ba9d378d1c960041ff8c36f3f5c02b9def67
  description: 'Perform a multi-band aperture photometry pipeline on the Messier 12
    (NGC 6218) globular cluster to construct a calibrated color-magnitude diagram
    (CMD). Using the V-band (Vcomb.fits) and B-band (Bcomb.fits) images in ~/AstroImages/m12_cmd/,
    measure at least 20 bright, well-separated stars using an aperture radius of 8,
    an inner sky annulus of 15, and an outer sky annulus of 25. Save the measurements
    to ~/AstroImages/m12_cmd/v_band_measurements.csv and ~/AstroImages/m12_cmd/b_band_measurements.csv.


    Create an analysis script at ~/AstroImages/m12_cmd/analyze_cmd.py to cross-match
    the bands (3-pixel tolerance) and the reference catalog (m12_catalog.csv, 5-pixel
    tolerance). The script must calculate photometric zero-points, apply them to the
    data, and export a calibrated photometry table to ~/AstroImages/m12_cmd/results/calibrated_photometry.csv
    with columns for star_id, x_pixel, y_pixel, V_inst, B_inst, V_cal, B_cal, and
    BV_color. Generate a CMD plot with B-V color on the x-axis and calibrated V magnitude
    on an inverted y-axis, saved to ~/AstroImages/m12_cmd/results/cmd_plot.png.


    Write a summary report to ~/AstroImages/m12_cmd/results/photometry_report.txt
    containing the number of stars measured in each band, the calculated zero-points
    (ZP_V = <value> and ZP_B = <value>), the observed B-V color range, and the magnitude
    of the brightest measured star in calibrated V. Login credentials: username ''ga'',
    password ''password123''.'
- id: cua_world_long_blender3d_env__procedural_rust_material
  env_name: blender3d_env
  task_name: procedural_rust_material
  platform: linux
  environment_sha256: 9ac57f8081605ac27699ded4a8dd6d253b54c79f3a1183bad98f91e63d13c47b
  description: 'You are a look-development artist creating a weathered vehicle material.
    Build a procedural rust-over-metal shader for the BMW car body using Blender''s
    Shader Editor. The material must show realistic paint deterioration where oxidation
    breaks through a metallic surface. Build a node network with: (1) a Noise Texture
    (Scale 5.0, Detail 8.0) connected to a Color Ramp whose black-to-white threshold
    is at position 0.4, generating the rust pattern mask; (2) two Principled BSDF
    shaders -- one for clean metal (dark grey Base Color, Metallic 1.0, Roughness
    0.2) and one for rust (brown Base Color, Metallic 0.0, Roughness 0.8); (3) a Mix
    Shader blending both BSDFs, driven by the Color Ramp output as its Factor; (4)
    a Voronoi Texture (Scale 15.0) connected through a Bump node (Strength 0.3) to
    the Normal input of both BSDFs for corrosion pitting detail. Apply this material
    to the car body object named ''CarBody''. Render the result to /home/ga/BlenderProjects/rust_render.png
    and save the project to /home/ga/BlenderProjects/rust_bmw.blend.'
- id: cua_world_long_blenderbim_env__single_storey_retail_unit_authoring
  env_name: blenderbim_env
  task_name: single_storey_retail_unit_authoring
  platform: linux
  environment_sha256: 3706c2eeb7865284a7755d95b3b4a4d3ca2528cf56f2c1b9f411524cc9b32f66
  description: 'A new IFC4 project has been set up in BlenderBIM (Bonsai) with a basic
    spatial hierarchy (IfcProject ''My Project'' > IfcSite ''My Site'' > IfcBuilding
    ''My Building'' > IfcBuildingStorey ''My Storey'' at elevation 0.0). Model a single-storey
    commercial retail unit within this project. The building has a 12m x 8m rectangular
    footprint and 3.2m floor-to-ceiling height. It contains three rooms: a main retail
    area (~60 sq m) along the south facade, a back-of-house storage room (~20 sq m),
    and a staff WC (~4 sq m) accessible from storage. The building envelope consists
    of four external IfcWall elements (200mm thick) forming a closed rectangular perimeter
    and two internal IfcWall partitions (100mm thick) dividing the three rooms. Include
    a ground floor IfcSlab and a flat roof IfcSlab. Place an external IfcDoor (1.0m
    x 2.1m) centered on the south wall and an internal IfcDoor (0.9m x 2.1m) between
    the retail area and storage. Define an IfcSpace for each room with a descriptive
    LongName. All elements must be contained within the building storey. Save the
    project as /home/ga/BIMProjects/retail_unit.ifc.'
- id: cua_world_long_bluemail_env__comprehensive_inbox_triage_and_report
  env_name: bluemail_env
  task_name: comprehensive_inbox_triage_and_report
  platform: linux
  environment_sha256: c6e7bfd5c088c23b025e7077766eadee6c321f2fcee25f03108833af6e1b7a20
  description: 'You are an engineering team lead performing a thorough weekly inbox
    triage. Your inbox contains 50 emails from various technical mailing lists, some
    of which are parts of ongoing discussion threads. Identify all discussion threads
    containing 3 or more messages, create a folder named ''Active-Threads'', and move
    every email belonging to these threads into it. Among the remaining inbox emails,
    identify those related to spam filtering, security, viruses, or abuse prevention,
    create a folder named ''Security-Review'', and move them there. Create a triage
    report at ~/Documents/triage_report.txt listing each thread found with its discussion
    topic, message count, and each participant''s full name and email address. The
    report should also include the total emails processed, security emails found,
    emails remaining in inbox, and a verification line confirming these three numbers
    sum to 50. Finally, draft an email to engineering-manager@company.com with subject
    ''Weekly Inbox Triage Report'' summarizing the most active thread and the security
    review findings. Login credentials: username ''ga'', password ''password123''.'
- id: cua_world_long_bridgecommand_env__collision_avoidance_investigation
  env_name: bridgecommand_env
  task_name: collision_avoidance_investigation
  platform: linux
  environment_sha256: de29d6b4e8faca3ca89b6e8187566ea6c654963e5042ee3803879d9e93919b9c
  description: 'You are a marine safety investigator at the UK MAIB examining a collision
    between two vessels in the Solent approaches. Evidence from Voyage Data Recorders
    and VTS radar is at /home/ga/Documents/Investigation/ (vessel_a_vdr.csv, vessel_b_vdr.csv,
    vts_traffic_snapshot.csv, weather_conditions.txt).


    Extrapolate Ships A and B''s VDR tracks to determine the collision point coordinates,
    collision time, and COLREGS encounter classification (head-on, crossing, or overtaking).
    Identify the give-way vessel. Compute CPA and TCPA for all vessel pairs based
    on their recorded tracks. Design a COLREGS-compliant avoidance maneuver for the
    give-way vessel achieving CPA >= 1.0nm from the collision partner AND CPA >= 0.5nm
    from all other traffic simultaneously, using the minimum course alteration that
    satisfies all constraints.


    Create a reconstruction scenario at /opt/bridgecommand/Scenarios/n) Collision
    Reconstruction/ reproducing all four vessels'' tracks from the evidence using
    waypoint legs. Create an avoidance scenario at /opt/bridgecommand/Scenarios/o)
    Avoidance Demonstration/ identical to the reconstruction except with the give-way
    vessel''s altered course.


    Write a formal investigation report at /home/ga/Documents/Investigation/collision_report.txt
    covering collision coordinates and time, encounter classification citing COLREGS
    rules, all CPA/TCPA values, the avoidance maneuver details, and achieved CPAs.


    Update bc5.ini with full_radar=1, arpa_on=1, max_radar_range=24.


    Login: ga / password123'
- id: cua_world_long_calligra_words_env__water_quality_ccr_compilation
  env_name: calligra_words_env
  task_name: water_quality_ccr_compilation
  platform: linux
  environment_sha256: 76997bd4645c9e6e308e1bd3007a80aaceecc48de29f35069e0e3a3557f543ef
  description: 'You are the Water Quality Program Manager for the City of Millbrook
    Department of Public Utilities. The EPA requires submission of the annual Consumer
    Confidence Report (CCR) by July 1. You must compile this year''s report from lab
    test results and draft narrative sections prepared by your engineering staff.
    On the Desktop you will find: lab_results_2025.odt (water quality test data for
    8 regulated contaminants in pipe-delimited format), ccr_narrative_sections.odt
    (draft narrative text with inconsistent formatting and internal draft notes marked
    [REMOVE] that must be deleted), and epa_ccr_format_guide.txt (EPA formatting requirements).
    Create millbrook_ccr_2025.odt on the Desktop following the format guide: a centered
    cover page (utility name 18pt bold, report title 16pt, year 14pt), auto-generated
    Table of Contents, Heading 1 for each of the seven required sections (Source Water
    Information, Water Treatment Process, Detected Contaminants, Violations & Explanations,
    Health Information, How to Participate, Contact Information), a 7-column detected
    contaminants table with bold header row and the Lead violation row in bold italic,
    all [REMOVE] notes deleted, a footer with "City of Millbrook -- CCR 2025" and
    page numbers, 12pt serif justified body text, and 1-inch margins. Save as millbrook_ccr_2025.odt
    on the Desktop.'
- id: cua_world_long_canvas_lms_env__bio201_outcomes_assessment_migration
  env_name: canvas_lms_env
  task_name: bio201_outcomes_assessment_migration
  platform: linux
  environment_sha256: cd05f6c36adaa24ee62fda2adef9028c75c26dc3a5063d9ddd8a670a68c7bfbd
  description: BIO201 is transitioning to outcomes-based assessment. A detailed migration
    plan has been posted as a page in the course. Log in as admin (canvas@example.edu
    / canvas-docker), navigate to BIO201 'Advanced Biology', read the 'Outcomes-Based
    Assessment Migration Plan' page, and bring the entire course into full compliance
    with the plan.
- id: cua_world_long_dbeaver_env__chinook_revenue_reconciliation
  env_name: dbeaver_env
  task_name: chinook_revenue_reconciliation
  platform: linux
  environment_sha256: 21d29de8eca7cfc33ef3be1cefcfb763b188e213f8b2c6d3db17435c073364e9
  description: 'The Chinook digital media store''s finance team has discovered that
    monthly revenue figures in the general ledger do not match invoice totals for
    several months in late 2013. The import log suggests a batch import may have been
    run twice after an initial failure, potentially causing duplicate data. Additionally,
    someone created a manual credit memo to partially offset the discrepancy, but
    it may have been applied to the wrong customer.


    Connect to ''/home/ga/Documents/databases/chinook_ledger.db'' with connection
    name ''LedgerAudit''. Investigate the discrepancy between the ''general_ledger''
    table (which contains correct pre-error revenue figures) and actual invoice data.
    Identify and remove any duplicate invoice line items introduced by the failed
    import, delete the improper compensating credit memo, recalculate affected invoice
    totals, and verify that all months now reconcile with the general ledger.


    Document every correction in a ''correction_log'' table (CorrectionId INTEGER
    PRIMARY KEY AUTOINCREMENT, CorrectionType TEXT, AffectedTable TEXT, AffectedIds
    TEXT, OldValue TEXT, NewValue TEXT, Reason TEXT). Export the correction log to
    ''/home/ga/Documents/exports/correction_report.csv'' and save all SQL to ''/home/ga/Documents/scripts/reconciliation.sql''.'
- id: cua_world_long_dhis2_env__rmncah_scorecard_dashboard
  env_name: dhis2_env
  task_name: rmncah_scorecard_dashboard
  platform: linux
  environment_sha256: 01acbe4d22727c8acdbcc7ee9a473cfe174846934a321a0fb4cfad5eb3a2bbba
  description: 'You are the National RMNCAH Programme Manager for Sierra Leone. Configure
    DHIS2 to produce a quarterly performance scorecard for monitoring district-level
    Reproductive, Maternal, Newborn, Child and Adolescent Health indicators.


    Create two indicators in DHIS2 Maintenance using the ''Per cent'' indicator type
    (factor 100):


    1. ''ANC 4th Visit Completion Rate (%)'' — numerator: ANC 4th or more visits;
    denominator: ANC 1st visit

    2. ''Penta1-Penta3 Dropout Rate (%)'' — numerator: (Penta1 doses given minus Penta3
    doses given); denominator: Penta1 doses given


    Create a legend set ''RMNCAH Performance'' with three tiers: Red (0–50, color
    #FF0000), Yellow (50–80, color #FFFF00), Green (80–100, color #00FF00).


    In Data Visualizer, build a pivot table named ''RMNCAH District Scorecard Q4 2025''
    showing both indicators for all districts for October–December 2025. Configure
    the layout with indicators as columns and districts as rows. Apply the RMNCAH
    Performance legend to the table.


    Create a dashboard named ''RMNCAH Scorecard Dashboard 2025'' containing the scorecard
    pivot table.


    Login: admin / district'
- id: cua_world_long_diagrams_net_env__microservices_outage_rca
  env_name: diagrams_net_env
  task_name: microservices_outage_rca
  platform: linux
  environment_sha256: abc286c4da0b921d52122a53b5d499894a4934f188390c62b986666f94bec710
  description: 'You are a Site Reliability Engineer at ShopStream Inc. On January
    15, 2026, a cascading failure caused a 47-minute outage affecting 3.2 million
    users. You have three files: an architecture diagram at ~/Diagrams/shopstream_architecture.drawio
    (8 microservices, databases, cache, and message queue with their connections),
    a monitoring timeline at ~/Desktop/incident_timeline.csv (28 timestamped events
    from the outage), and a dependency matrix at ~/Desktop/service_dependencies.csv
    (communication types and timeout configurations). Perform a failure cascade root
    cause analysis by annotating the architecture diagram. Determine which service
    was the true root cause by analyzing the timeline against the dependency graph,
    and mark it with a red double-border and a ''ROOT CAUSE'' label. Color-code every
    service by its status at peak impact (14:31 UTC): red for down, orange for degraded,
    green for healthy. Draw dashed red arrows tracing the failure propagation path
    from root cause through each affected downstream service, labeling each arrow
    with the calculated propagation delay. On a second diagram page named ''Remediated
    Architecture'', show the post-incident fixes: convert the synchronous dependencies
    that amplified the cascade to asynchronous via message queue, and add circuit
    breaker annotations at the critical points where the cascade could have been stopped.
    Save the diagram and export as PDF to ~/Diagrams/shopstream_rca.pdf. Login: username
    ''ga'', password ''password123''.'
- id: cua_world_long_docker_desktop_env__diagnose_broken_microservices_stack
  env_name: docker_desktop_env
  task_name: diagnose_broken_microservices_stack
  platform: linux
  environment_sha256: ca2cd55632b9d53d05e207f1dc7969ee5a9a23f8bba13294fab13aec1143e33e
  description: 'A Flask-based inventory API with PostgreSQL, Redis, and an Nginx reverse
    proxy has been deployed at /home/ga/microservices-debug/ using Docker Compose.
    All four services have been started, but the application is not functioning correctly.
    Diagnose and fix all configuration issues so that: (1) curl http://localhost:80/api/health
    returns HTTP 200 with JSON containing "status": "healthy", "database": "connected",
    and "cache": "connected", (2) curl http://localhost:80/api/items returns HTTP
    200 with a JSON array of inventory items from the database with id, name, and
    price fields, and (3) all four services (nginx, flask-app, db, redis) remain running.
    The Flask application source code (app/app.py) is correct and must NOT be modified.
    The issues are in the deployment configuration.'
- id: cua_world_long_draw_desktop_env__ecommerce_platform_erd
  env_name: draw_desktop_env
  task_name: ecommerce_platform_erd
  platform: linux
  environment_sha256: b79e021236604005f074bc20a6144800a1d1cc49418adc556b279b20d94a9143
  description: 'You are a Database Architect at ShopSphere, an e-commerce startup
    preparing for Series B due diligence. The VP of Engineering needs a comprehensive
    Physical Entity-Relationship Diagram for the production database before the technical
    review. Using the SQL schema at ~/Desktop/shopsphere_schema.sql, create a complete
    Physical ERD in draw.io for all 14 tables. Each entity box must list the table''s
    columns with data types, marking primary keys with [PK] and foreign keys with
    [FK]. Draw all foreign-key relationships as connections using crow''s foot or
    arrow notation -- pay attention to self-referencing keys and tables with multiple
    foreign keys to the same target. Organize entities into 3 color-coded domain groups
    as indicated in the schema''s section headers: Blue (#dae8fc) for Customer domain,
    Green (#d5e8d4) for Product domain, and Orange (#ffe6cc) for Order domain. Include
    a second page titled ''Relationship Summary'' listing each foreign key with source
    table, target table, and cardinality. Save as ~/Desktop/shopsphere_erd.drawio
    and export Page 1 as ~/Desktop/shopsphere_erd.png. Login: username=ga, password=password123'
- id: cua_world_long_drupal_commerce_env__customer_revenue_vip_reward
  env_name: drupal_commerce_env
  task_name: customer_revenue_vip_reward
  platform: linux
  environment_sha256: b3476279257efb8155e60530c2ec861de307f98ed1d37c446eb82963590b37d7
  description: 'Urban Electronics wants to identify and reward their highest-spending
    customer. Build a customer revenue report, then create a targeted VIP promotion
    based on what it reveals.


    Build the Customer Revenue Report: Create a Views page at /admin/commerce/customer-revenue,
    restricted to users with ''access commerce administration pages'' permission.
    Use Commerce Orders as the base entity with a User relationship through the order''s
    uid field. Enable aggregation to group results by customer, displaying: Username,
    Number of Orders (COUNT of order IDs), and Total Spent (SUM of order total prices).
    Filter to only include completed orders. Sort by Total Spent descending, 25 items
    per page.


    Reward the Top Customer: Use your report to identify the customer with the highest
    total spending. Create an active promotion named ''VIP Reward - [username]'' (using
    their actual username) offering 20% off their next order of $100 or more. Add
    coupon code ''VIP-[USERNAME]'' (uppercase) with a single-use limit.


    Navigation: Add a menu link titled ''Customer Revenue'' pointing to /admin/commerce/customer-revenue
    in the Main navigation.'
- id: cua_world_long_ekylibre_env__equipment_acquisition_full_cycle
  env_name: ekylibre_env
  task_name: equipment_acquisition_full_cycle
  platform: linux
  environment_sha256: 9b6b73f50856315eb6377d6cb4a86b479f7db18724be6d7499841b6d4a65c569
  description: 'You are the accountant at GAEC JOULIN. Log in to Ekylibre at http://demo.ekylibre.farm:3000
    using admin@ekylibre.org / 12345678. Process the full acquisition of a new Claas
    Lexion 770 combine harvester (285,000.00 EUR HT, 20% TVA). This requires a supplier
