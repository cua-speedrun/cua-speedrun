- id: cua_world_long_onlyoffice_env__dcf_valuation_model
  env_name: onlyoffice_env
  task_name: dcf_valuation_model
  platform: linux
  environment_sha256: a6c3e81e849873f390c71e7fb2d311c883f56b29a7a332e96de070dc28cee3da
  description: 'You are a financial analyst. Open novapeak_historicals.xlsx from ~/Documents/Spreadsheets/.
    It contains three years (Year 1-3) of historical income statement and balance
    sheet data for NovaPeak Analytics, a B2B SaaS company.


    Build a 5-year Discounted Cash Flow (DCF) valuation model with the following sheets:


    Assumptions: Derive operating margins (COGS, Sales & Marketing, R&D, G&A as percent
    of revenue), D&A rate, CapEx rate, and working capital ratios from Year 3 historical
    data. Note: Year 2 includes a one-time $500,000 restructuring charge that should
    be excluded from your normalized analysis. Management projects 20% annual revenue
    growth for Years 4 through 8.


    Projections: Project the full income statement for Years 4-8 using the derived
    margins applied to projected revenue. Project balance sheet working capital items
    using historical ratios. Tax rate is 25%.


    FCF: Compute annual Unlevered Free Cash Flow for each projected year: FCF = EBIT
    x (1 - Tax Rate) + D&A - CapEx - Change in Net Working Capital.


    DCF: Discount each year''s FCF at a WACC of 10.5%. Compute terminal value using
    the Gordon Growth Model with a 2.5% perpetual growth rate applied to Year 8 FCF.
    Sum the present values of all FCFs and the terminal value to arrive at the Enterprise
    Value. Display the Enterprise Value prominently.


    Save as novapeak_dcf_model.xlsx in ~/Documents/Spreadsheets/.'
