  platform: linux
  environment_sha256: 0c3aaba45e6c31e1ac9846a128aa0c335c3387c8b9e99801d5eb3ae9d7c8ecf8
  description: 'The file ''/home/ga/Documents/JASP/WorldHappiness.csv'' is already
    open in JASP. This is real data from the World Happiness Report covering 155 countries
    with columns including Happiness Score, GDP per Capita, Family, Life Expectancy,
    Freedom, Generosity, and Government Corruption.


    Conduct a complete regression analysis to determine what national-level factors
    predict happiness and whether GDP has a curvilinear (diminishing returns) relationship
    with happiness. The analysis should include: descriptive statistics (mean, SD,
    min, max) with distribution plots for Happiness Score, GDP per Capita, Family,
    Life Expectancy, and Freedom; a correlation matrix of these same five variables
    with significance flags and a heatmap; a multiple regression predicting Happiness
    Score from GDP per Capita, Family, Life Expectancy, and Freedom with collinearity
    diagnostics (VIF/Tolerance), residual plots (Q-Q and Residuals vs. Predicted),
    and Part/Partial correlations (this is Model 1); and a second regression (Model
    2) that adds a computed column ''GDP_squared'' (GDP per Capita times itself) to
    test the curvilinear hypothesis.


    Save the complete analysis as ''/home/ga/Documents/JASP/happiness_regression_pipeline.jasp''.
    Write a text report to ''/home/ga/Documents/JASP/regression_report.txt'' containing:
    the Pearson r between GDP per Capita and Happiness Score, the R-squared for Model
    1, the R-squared for Model 2, the highest VIF value from Model 1, the p-value
    for GDP_squared in Model 2, and a one-sentence conclusion stating which model
    fits better.'
