- id: cua_world_long_fiji_env__confocal_multichannel_cell_pipeline
  env_name: fiji_env
  task_name: confocal_multichannel_cell_pipeline
  platform: linux
  environment_sha256: 9c3c6f2203196a23c8d471885d70c0d96c6ebfb40686895db312a3748301f511
  description: 'Using ~/Fiji_Data/raw/confocal/FluorescentCells.tif (3-channel fluorescence
    image, 512×512, pixel size 0.32 µm), perform per-channel quantitative analysis
    and assemble a publication figure.


    Split the image into its three channels and calibrate each at 0.32 µm/pixel.


    For the blue channel (nuclei): apply flat-field correction using Gaussian blur
    division (sigma=50), then background subtraction (rolling ball 50px), Otsu thresholding
    with watershed separation, and particle analysis (100–5000 px², circularity 0.4–1.0,
    excluding edges). Record total cell count and mean nuclear area.


    For the green channel (microtubules): apply background subtraction (rolling ball
    30px), auto-threshold, skeletonize the binary image, and run skeleton analysis.
    Record total branch count and junction count.


    For the red channel (F-actin): apply background subtraction (rolling ball 20px),
    auto-threshold, and particle analysis (20–2000 px², circularity 0.0–1.0, excluding
    edges). Record actin feature count and mean feature area.


    Create an RGB composite by merging the three channels to their respective colors.
    Assemble a 2×3 publication montage showing: [Blue ch | Green ch | Red ch | Nuclear
    mask | Skeleton map | RGB composite] with a 10 µm scale bar.


    Export channel_measurements.csv with columns Channel, Metric_Name, Value (minimum
    6 rows: nuclear_count, mean_nuclear_area_um2, branch_count, junction_count, actin_feature_count,
    mean_actin_feature_area_um2), and analysis_report.txt summarizing all metrics
    with units. All outputs to ~/Fiji_Data/results/cell_pipeline/.'
