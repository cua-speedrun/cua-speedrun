    compute: `c.name AS country_name`, `c.adm0_a3 AS iso_code`, `c.continent`, `COUNT(p.gid)
    AS city_count`, `COALESCE(SUM(p.pop_max),0) AS total_urban_pop`, `c.geom AS geom`.
