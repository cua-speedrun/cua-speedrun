- id: cua_world_long_psychopy_env__create_ant_experiment
  env_name: psychopy_env
  task_name: create_ant_experiment
  platform: linux
  environment_sha256: 9194899a6a5c5c74a8882098a8bda48650ae3548851e3a310a8d7795a41a8f9b
  description: 'Create a complete Attentional Network Test (ANT) experiment in PsychoPy
    Builder, following the paradigm established by Fan et al. (2002). The ANT measures
    three attention networks (alerting, orienting, executive control) by crossing
    cue and flanker manipulations.


    Each trial sequence: variable fixation cross (400-1600ms, uniformly randomized)
    followed by a cue flash (100ms), then a blank fixation interval (400ms), then
    the target arrow flanked by congruent, incongruent, or neutral arrows displayed
    until response or 1700ms timeout. Participants press ''left'' and ''right'' arrow
    keys to indicate the direction of the central target arrow.


    Create a conditions file ant_conditions.csv with the full factorial design: 4
    cue types (none, center, double, spatial) x 3 flanker types (congruent, incongruent,
    neutral) x 2 target locations (above, below fixation) x 2 target directions (left,
    right) = 48 rows. Required columns: cue_type, flanker_type, target_location, target_direction,
    corrAns.


    Experiment structure must include: an instructions routine explaining the task;
    a practice block looping over the conditions with per-trial accuracy feedback;
    a rest screen after practice; three main experimental blocks each looping over
    the conditions file with rest screens between blocks; and a summary routine displaying
    mean reaction time and overall accuracy.


    A Code component must handle randomizing the fixation duration each trial, constructing
    the flanker-target stimulus display from the condition variables, controlling
    cue visibility based on cue_type, and computing summary statistics for the final
    screen.


    Save as /home/ga/PsychoPyExperiments/ant_experiment.psyexp.'
