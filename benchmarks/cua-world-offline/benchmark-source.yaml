  platform: linux
  environment_sha256: d73dc75229afa2b308f69b56e99f4c6585280b4825b76d136eedb962b12771c0
  description: 'You are a sustainability engineer preparing the carbon footprint of
    a standard concrete masonry unit (CMU, 17.2 kg). Build a complete cradle-to-gate
    life cycle model in OpenLCA.


    Create a new database ''CMU_Footprint''. Model four unit processes with the exact
    flows and quantities below:


    ''Cement Production'': output 1 kg ''Portland Cement'' (reference product flow);
    inputs 1.52 kg ''Limestone'', 0.092 kg ''Coal'' (product flows); elementary emission
    output 0.83 kg ''Carbon Dioxide'' to air (representing calcination).


    ''Aggregate Processing'': output 1 kg ''Mixed Aggregate'' (reference product flow);
    inputs 1.05 kg ''Raw Gravel'', 0.003 kg ''Diesel Fuel'' (product flows).


    ''Concrete Mixing'': output 1 kg ''Fresh Concrete'' (reference product flow);
    inputs 0.15 kg ''Portland Cement'', 0.75 kg ''Mixed Aggregate'', 0.10 kg ''Process
    Water'' (product flows).


    ''Block Molding'': output 17.2 kg ''CMU Block'' (reference product flow); inputs
    17.2 kg ''Fresh Concrete'', 0.021 kg ''Diesel Fuel'' (product flows).


    Create a product system ''CMU_Production_System'' with ''Block Molding'' as reference
    process. Link all upstream processes: Cement Production and Aggregate Processing
    feed into Concrete Mixing, which feeds Block Molding.


    Import LCIA methods from ~/LCA_Imports/lcia_methods.zip. Calculate Global Warming
    Potential using TRACI 2.1 and export results to ~/LCA_Results/cmu_footprint.csv.'
