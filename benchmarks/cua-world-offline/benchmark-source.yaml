  environment_sha256: 6e9ee6321157a79650cd7f24d6e7097dc8756cf8ccb238d58019a06bde3154d3
  description: 'You are preparing an eclipse observation guide for the August 12,
    2026 Arctic Total Solar Eclipse. Read the eclipse data from /home/ga/data/historical_eclipses.json
    to find the event timing and best viewing location. Set Stellarium to the best
    viewing location listed in the data file. Configure the display: atmosphere ON,
    landscape/ground OFF, constellation lines ON. Starting approximately one hour
    before the greatest eclipse time (from the data file), systematically advance
    time to determine all four eclipse contact points by visually inspecting the Sun:
    C1 (partial eclipse begins, Moon''s limb first touches the Sun), C2 (totality
    begins, Sun fully obscured by the Moon), C3 (totality ends, first sliver of sunlight
    reappears), C4 (partial eclipse ends, Moon completely clears the Sun). At each
    contact, record the UTC time and the Sun''s altitude and azimuth. During totality
    (C2-C3), zoom out and identify all bright planets or stars visible in the darkened
    sky near the eclipsed Sun. Take at least one screenshot at each contact plus one
    wide-field shot during totality (minimum 5 screenshots). As a control, change
    location to Rome, Italy (41.90 N, 12.50 E) at the mid-eclipse time and document
    the eclipse appearance from this location. Take a screenshot. Write a complete
    analysis to ~/Desktop/eclipse_contact_times.txt including: all four contact UTC
    times with Sun altitude/azimuth, totality duration (C3 minus C2), objects visible
    during totality, and the Rome control observation result.'
