- id: cua_world_long_system_advisor_model_env__optimize_pv_battery_tou_arbitrage
  env_name: system_advisor_model_env
  task_name: optimize_pv_battery_tou_arbitrage
  platform: linux
  environment_sha256: eebea33036eb747fbc625bbd506535a765dd05d656b9df3e7854d3ea7916d01b
  description: 'Using PySAM and Python, find the optimal battery capacity for a grid-export-limited
    PV plant under time-of-use pricing.


    PV System (Pvwattsv8): 100 MW DC, single-axis tracking, DC:AC ratio 1.3, 14% losses,
    Daggett CA (bundled TMY from /home/ga/.SAM/solar_resource_dir.txt).


    Grid Limit: Maximum 50 MW AC export. Any generation exceeding 50 MW must be curtailed
    (lost) or stored in the battery.


    TOU Prices (hours 0-23): Off-peak $0.04/kWh (hours 0-7 and 22-23, all months);
    Mid-peak $0.08/kWh (hours 8-15 and 21, all months); On-peak $0.18/kWh (hours 16-20,
    October through May); Super-peak $0.30/kWh (hours 16-20, June through September).


    Battery: 50 MW power rating, 85% round-trip efficiency, 10% minimum SOC. Test
    capacities [0, 50, 100, 150, 200, 300] MWh. The battery charges from generation
    that would otherwise be curtailed, and discharges during on-peak or super-peak
    hours.


    Economics: Battery installed cost $200/kWh, 8% discount rate, 15-year analysis
    period. NPV = present value of 15 years of incremental annual revenue (versus
    the 0 MWh no-battery baseline) minus upfront battery capital cost.


    For each battery capacity, compute: annual curtailed energy (MWh), annual battery
    discharge (MWh), total annual revenue ($), and 15-year NPV versus the no-battery
    baseline ($).


    Save all results to /home/ga/Documents/SAM_Projects/curtailment_battery_optimization.json
    containing: pv_generation_before_curtailment_mwh, no_battery_revenue_dollars,
    no_battery_curtailed_mwh, a battery_scenarios array (each entry with capacity_mwh,
    curtailed_mwh, discharge_mwh, revenue_dollars, npv_dollars), and optimal_capacity_mwh
    (the capacity with the highest NPV).'
