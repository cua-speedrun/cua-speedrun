  environment_sha256: 33a44bdae83ef65dc83e5870ccea488191edda6eb4a7f0e91d5a6471ace58bf9
  description: 'You are a mission analyst for the Mars Atmospheric & Climate Explorer
    (MACE). The spacecraft is on hyperbolic approach to Mars. Using the approach state
    and propulsion specifications in ~/Desktop/mars_capture_spec.txt, design the complete
    orbit capture sequence in GMAT.


    The mission requires two impulsive burns at Mars periapsis: a Mars Orbit Insertion
    (MOI) burn that captures the spacecraft into a high elliptical orbit while simultaneously
    changing the orbital inclination, followed by a Period Reduction Maneuver (PRM)
    at the next periapsis to lower the apoapsis and achieve the target science orbit.
    Both burns must use differential correction targeting to achieve the specified
    orbital elements.


    The GMAT simulation must use a Mars-centered coordinate system, Mars50c gravity
    model (degree >= 10), Sun third-body perturbation, and propulsion hardware with
    fuel depletion tracking. After achieving the science orbit, propagate for 30 Earth
    days to verify orbital stability.


    All target orbital elements, spacecraft properties, and detailed burn strategy
    are specified in ~/Desktop/mars_capture_spec.txt.


    Save the GMAT script to ~/GMAT_output/mars_capture.script

    Save results to ~/GMAT_output/mars_capture_results.txt


    Results format (one key: value per line):

    MOI_DeltaV_mps: <value>

    MOI_Fuel_kg: <value>

    MOI_PostBurn_SMA_km: <value>

    MOI_PostBurn_ECC: <value>

