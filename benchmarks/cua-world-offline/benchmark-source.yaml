- id: cua_world_long_openice_env__infusion_interlock_oq_protocol
  env_name: openice_env
  task_name: infusion_interlock_oq_protocol
  platform: linux
  environment_sha256: 5e7bc742cbbd4763a06636557976789c9a07edb3a6eff0ef89ca03e0219d91e9
  description: 'You are a biomedical systems engineer conducting Operational Qualification
    (OQ) of OpenICE''s Infusion Safety closed-loop interlock per IEC 80001-1 before
    clinical deployment. Validate four distinct safety behaviors.


    Create a Simulated Pulse Oximeter and Simulated Infusion Pump in the OpenICE Supervisor,
    then launch the Infusion Safety clinical application. Configure SpO2 alarm monitoring
    with a low alarm threshold of 90%. Execute this test protocol:


    Test 1 - Threshold Response: Record the pump status at baseline SpO2. Then adjust
    SpO2 below the 90% threshold and record how the pump status changes. Take a screenshot
    to /home/ga/Desktop/oq_test_threshold.png.


    Test 2 - Recovery Hysteresis: With the pump in its post-alarm state from Test
    1, gradually restore SpO2 above the threshold. Determine the exact SpO2 value
    at which the pump resumes normal operation. Document whether this recovery point
    equals the trigger threshold or differs (indicating hysteresis).


    Test 3 - Sensor Failure Fail-Safe: Restore normal operation, then simulate a sensor
    disconnection by removing the Pulse Oximeter from the system. Record the pump''s
    response. Take a screenshot to /home/ga/Desktop/oq_test_failsafe.png.


    Test 4 - Boundary Condition: Reconnect a Pulse Oximeter. Set SpO2 to exactly 90%
    (the alarm threshold). Record whether the pump is active or stopped at the boundary.


    Record observations in /home/ga/Desktop/oq_test_results.csv with columns: Test_ID,Test_Name,Expected_Behavior,Observed_Behavior,Pass_Fail


    Write a validation report at /home/ga/Desktop/oq_validation_report.txt including:
    both device UDIs, all four test results, hysteresis finding, and overall OQ determination
    (PASS/FAIL).'
- id: cua_world_long_openlca_env__cradle_to_gate_cmu_carbon_footprint
  env_name: openlca_env
