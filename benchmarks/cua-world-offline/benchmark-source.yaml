  platform: linux
  environment_sha256: ffa6b98b12183c478bcde208f88e64b2b26aac17299570cc2822fe3ce68eb3b2
  description: 'You are a traffic signal engineer at the Municipality of Bologna.
    The Pasubio corridor''s traffic signals were recently reset to an equal-green-split
    configuration during a controller upgrade, causing widespread intersection delays.
    Your task is to restore efficient signal operation by redesigning timing plans
