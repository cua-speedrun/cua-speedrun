- path: scripts/setup_jstock.sh
  old: |2
        # Close JStock gracefully so it saves its config
        su - ga -c "DISPLAY=:1 xdotool key alt+F4" 2>/dev/null || true
        sleep 2

        # If a save-on-exit dialog appears, press Enter to confirm
        su - ga -c "DISPLAY=:1 xdotool key Return" 2>/dev/null || true
        sleep 8

        # Force kill if still running
        pkill -f "jstock.jar" 2>/dev/null || true
        sleep 3
  new: |2
        # Linux saves native options on window disposal, not on SIGTERM.
        # Target exact native window titles; keyboard focus is not a contract.
        for ((attempt=0; attempt<60; attempt++)); do
            if ! pgrep -u ga -f 'jstock[.]jar' > /dev/null; then
                break
            fi
            su - ga -c "DISPLAY=:1 wmctrl -F -c 'JStock News'" 2>/dev/null || true
            su - ga -c "DISPLAY=:1 wmctrl -F -c 'System Tray Not Supported'" 2>/dev/null || true
            su - ga -c "DISPLAY=:1 wmctrl -F -c 'JStock - Free Stock Market Software'" 2>/dev/null || true
            sleep 1
        done
        if pgrep -u ga -f 'jstock[.]jar' > /dev/null; then
            echo "ERROR: JStock did not exit normally during warm-up"
            exit 1
        fi
        if [ ! -s /home/ga/.jstock/1.0.7/config/options.xml ]; then
            echo "ERROR: JStock did not save native options during warm-up"
            exit 1
        fi
        echo "JStock exited normally and saved native options"
