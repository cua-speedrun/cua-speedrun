- path: scripts/setup_jstock.sh
  old: 'echo "Pre-populated data re-applied"'
  new: |
    # Use the application's persisted preference; the asynchronous news fetch
    # can otherwise open a modal dialog after the task has already started.
    python3 <<'JSTOCK_OPTIONS' || exit 1
    from pathlib import Path
    import re
    import xml.etree.ElementTree as ET

    path = Path('/home/ga/.jstock/1.0.7/config/options.xml')
    original = path.read_text(encoding='utf-8')
    root = ET.fromstring(original)
    if root.tag != 'org.yccheok.jstock.gui.JStockOptions':
        raise RuntimeError('Unexpected native JStock options root')
    if len(root.findall('isAutoUpdateNewsEnabled')) != 1:
        raise RuntimeError('Expected one native JStock news preference')
    updated, count = re.subn(
        r'<isAutoUpdateNewsEnabled>\s*(?:true|false)\s*</isAutoUpdateNewsEnabled>',
        '<isAutoUpdateNewsEnabled>false</isAutoUpdateNewsEnabled>', original)
    if count != 1:
        raise RuntimeError('Unrecognized native JStock news preference')
    path.write_text(updated, encoding='utf-8')
    print('Disabled automatic JStock news in existing native options')
    JSTOCK_OPTIONS
    echo "Pre-populated data re-applied"
- path: tasks/quarterly_portfolio_rebalance/export_result.sh
  old: |
    # 1. Kill JStock to flush all CSV data to disk
    # ============================================================
    pkill -f "jstock" 2>/dev/null || true
    sleep 4
  new: |
    # 1. Close JStock normally so it saves its native CSVs
    # ============================================================
    # Linux's shutdown hook does not save on SIGTERM. Normal window disposal
    # saves the portfolio and watchlist before the process exits.
    for ((attempt=0; attempt<60; attempt++)); do
        if ! pgrep -u ga -f 'jstock[.]jar' > /dev/null; then
            break
        fi
        su - ga -c "DISPLAY=:1 wmctrl -F -c 'JStock News'" 2>/dev/null || true
        su - ga -c "DISPLAY=:1 wmctrl -F -c 'System Tray Not Supported'" 2>/dev/null || true
        su - ga -c "DISPLAY=:1 wmctrl -F -c 'JStock - Free Stock Market Software'" 2>/dev/null || true
        sleep 1
    done
    if pgrep -u ga -f 'jstock[.]jar' > /dev/null; then
        echo "ERROR: JStock did not exit normally; refusing to export stale state" >&2
        exit 1
    fi
