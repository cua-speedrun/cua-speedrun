schema_version: 1
runner: slurm
name: default
description: One reusable compute replica per Slurm job, with optional GPU allocation.

job:
  overhead_minutes: 30
  start_timeout_minutes: 120
  cpus_per_replica:
    default: 6
  mem_per_replica:
    default: 32G
  gpu_types:
    L4: L4
    H100: H100
    L40S: L40S
    H200: H200

# Add partition, account, or QoS options and adjust GPU names for your cluster.
submit_command:
  - sbatch
  - --parsable
  - --no-requeue
  - --job-name=cua-${evaluation_id}-${replica}
  - --time=${job_time}
  - --cpus-per-task=${cpus}
  - --mem=${mem}
  - --output=${log_path}
gpu_arguments:
  - --gres=gpu:${gpu_type}:1
step_command:
  - srun
  - --jobid=${job_id}
  - --overlap
  - --exact
  - --nodes=1
  - --ntasks=1
  - --cpus-per-task=1
  - --chdir=${submission_dir}
cancel_command:
  - scancel
  - ${job_id}
script: |
  #!/usr/bin/env bash
  set -euo pipefail
  exec ${worker_command}
